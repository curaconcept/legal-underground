<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities — Legal Underground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23faf4de' stroke='%234553b8' stroke-width='3'/%3E%3Cpath d='M32 16v26' stroke='%23d9a916' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M18 22h28' stroke='%23d9a916' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M18 22l-4.5 10a5.4 5.4 0 0010.8 0L20 22' fill='%23f0d576' stroke='%23d9a916' stroke-width='2.4'/%3E%3Cpath d='M46 22l-4.5 10a5.4 5.4 0 0010.8 0L48 22' fill='%23f0d576' stroke='%23d9a916' stroke-width='2.4'/%3E%3Cpath d='M24 46h16' stroke='%23d9a916' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<main class="page">
  <div class="container">
    <div class="dash-head">
      <div>
        <div class="eyebrow" style="margin-bottom:8px">The board</div>
        <h1>Open <span class="grad-text">opportunities</span></h1>
        <p class="sub">Pro bono internships, clerkships, research roles, and volunteer positions from our partner network. Some listings link to an organization's own application page.</p>
      </div>
    </div>

    <div class="jobs-toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="input" id="q" placeholder="Search titles, organizations, keywords…">
      </div>
      <select class="input" id="sort" style="width:auto">
        <option value="new">Newest first</option>
        <option value="deadline">Deadline soonest</option>
        <option value="az">A → Z</option>
      </select>
      <span class="jobs-count" id="count"></span>
    </div>

    <button class="btn btn-ghost filters-toggle" id="filtersToggle" type="button" aria-expanded="false">Show filters</button>

    <div class="jobs-layout">
      <aside class="card filters" id="filtersPanel">
        <div class="fgroup">
          <h4>Practice areas</h4>
          <div class="topic-cloud" id="topicCloud"></div>
        </div>
        <div class="fgroup">
          <h4>Work mode</h4>
          <div id="modeChecks"></div>
        </div>
        <div class="fgroup">
          <h4>Role type</h4>
          <div id="typeChecks"></div>
        </div>
        <div class="fgroup">
          <h4>Compensation</h4>
          <div id="compChecks"></div>
        </div>
        <div class="fgroup">
          <h4>Location</h4>
          <select class="input" id="cityFilter"><option value="">All locations</option></select>
        </div>
        <button class="btn btn-ghost btn-sm clear-btn" id="clearFilters">Clear all filters</button>
      </aside>

      <section>
        <div class="jobs-list" id="jobsList"></div>
      </section>
    </div>
  </div>
</main>

<script type="module">
  import { bootPage, renderFooter, initReveal, openAuthModal, openModal, closeModal, toast, esc, fmtDate, timeAgo, daysUntil, compChip, openJobDetailModal, isExternalJob, $, $$ } from "../js/ui.js";
  import { store, getUser } from "../js/store.js";
  import { TOPICS, WORK_MODES, JOB_TYPES, COMP_TYPES, displayHours } from "../js/config.js";

  await bootPage("jobs");
  renderFooter();

  const filtersPanel = $("#filtersPanel");
  const filtersToggle = $("#filtersToggle");
  filtersToggle.addEventListener("click", () => {
    const open = filtersPanel.classList.toggle("open");
    filtersToggle.setAttribute("aria-expanded", open);
    filtersToggle.textContent = open ? "Hide filters" : "Show filters";
  });

  let jobs = await store.listJobs();
  const state = { q: "", topics: new Set(), modes: new Set(), types: new Set(), comps: new Set(), city: "", sort: "new" };

  // ----- build filter controls -----
  $("#topicCloud").innerHTML = TOPICS.map((t) => `<span class="chip" data-topic="${esc(t)}">${esc(t)}</span>`).join("");
  const mkChecks = (id, list, key) => {
    $(id).innerHTML = list.map((v) => `
      <label class="fcheck"><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join("");
    $$(`${id} input`).forEach((cb) => cb.addEventListener("change", () => {
      cb.checked ? state[key].add(cb.value) : state[key].delete(cb.value);
      render();
    }));
  };
  mkChecks("#modeChecks", WORK_MODES, "modes");
  mkChecks("#typeChecks", JOB_TYPES, "types");
  mkChecks("#compChecks", COMP_TYPES, "comps");

  const cities = [...new Set(jobs.map((j) => j.city))].sort();
  $("#cityFilter").innerHTML += cities.map((c) => `<option>${esc(c)}</option>`).join("");

  $$("#topicCloud .chip").forEach((chip) =>
    chip.addEventListener("click", () => {
      const t = chip.dataset.topic;
      chip.classList.toggle("on");
      chip.classList.contains("on") ? state.topics.add(t) : state.topics.delete(t);
      render();
    }));

  $("#q").addEventListener("input", (e) => { state.q = e.target.value.toLowerCase(); render(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#cityFilter").addEventListener("change", (e) => { state.city = e.target.value; render(); });
  $("#clearFilters").addEventListener("click", () => {
    state.q = ""; state.city = ""; state.sort = "new";
    state.topics.clear(); state.modes.clear(); state.types.clear(); state.comps.clear();
    $("#q").value = ""; $("#sort").value = "new"; $("#cityFilter").value = "";
    $$(".filters input[type=checkbox]").forEach((c) => (c.checked = false));
    $$("#topicCloud .chip").forEach((c) => c.classList.remove("on"));
    render();
  });

  // ----- filtering + rendering -----
  function filtered() {
    let list = jobs.filter((j) => {
      if (state.q) {
        const hay = `${j.title} ${j.org} ${j.description} ${j.topics.join(" ")} ${j.city}`.toLowerCase();
        if (!hay.includes(state.q)) return false;
      }
      if (state.topics.size && !j.topics.some((t) => state.topics.has(t))) return false;
      if (state.modes.size && !state.modes.has(j.workMode)) return false;
      if (state.types.size && !state.types.has(j.type)) return false;
      if (state.comps.size && !state.comps.has(j.comp)) return false;
      if (state.city && j.city !== state.city) return false;
      return true;
    });
    if (state.sort === "deadline") list = list.slice().sort((a, b) => a.deadline - b.deadline);
    else if (state.sort === "az") list = list.slice().sort((a, b) => a.title.localeCompare(b.title));
    else list = list.slice().sort((a, b) => b.postedAt - a.postedAt);
    return list;
  }


  const PIN_SVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4-2.5-7-6-7-10a7 7 0 1 1 14 0c0 4-3 7.5-7 10Z" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="11" r="2.4" stroke="currentColor" stroke-width="2.2"/></svg>`;

  function render() {
    const list = filtered();
    $("#count").textContent = `${list.length} role${list.length === 1 ? "" : "s"}`;
    const box = $("#jobsList");
    if (!list.length) {
      box.innerHTML = `<div class="card empty-state">
        <div class="empty-ico"><svg width="52" height="52" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="#4553b8" stroke-width="1.6"/><path d="m20 20-4.8-4.8" stroke="#9a7714" stroke-width="1.6" stroke-linecap="round"/><path d="M8 10.5h5" stroke="#9a7714" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        <h3>Nothing down here yet</h3>
        <p>No roles match those filters — try widening your search.</p></div>`;
      return;
    }
    box.innerHTML = list.map((j) => {
      const external = isExternalJob(j);
      const soon = j.status === "soon";
      const dl = j.deadline ? daysUntil(j.deadline) : null;
      return `
      <article class="card card-hover job-card reveal visible" data-id="${esc(j.id)}">
        <div class="job-card-top">
          <div>
            <h3>${esc(j.title)}</h3>
            <div class="org">${esc(j.org)}</div>
          </div>
          ${soon
            ? `<span class="chip chip-gold">Accepting applications soon</span>`
            : external
              ? `<span class="chip chip-gold">Apply via link ↗</span>`
              : `<span class="chip ${compChip(j.comp)}">${esc(j.comp)}</span>`}
        </div>
        <div class="job-meta">
          ${j.city ? `<span class="chip chip-muted">${PIN_SVG} ${esc(j.city)}</span>` : ""}
          ${j.workMode ? `<span class="chip chip-muted">${esc(j.workMode)}</span>` : ""}
          ${j.type ? `<span class="chip chip-muted">${esc(j.type)}</span>` : ""}
          ${j.topics.slice(0, 3).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
        </div>
        <p class="job-desc">${esc(j.description)}</p>
        <div class="job-foot">
          <span>Posted ${timeAgo(j.postedAt)}${j.hours ? ` · ${esc(displayHours(j.hours))}` : ""}</span>
          <span style="color:${soon ? "var(--gold-deep)" : external ? "var(--gold-deep)" : dl !== null && dl <= 7 ? "var(--red)" : "var(--faint)"}">${
            soon ? "Accepting applications soon"
            : external ? "Apply on organization site"
            : dl !== null ? (dl > 0 ? `Apply by ${fmtDate(j.deadline)}` : "Deadline passed")
            : ""}</span>
        </div>
      </article>`;
    }).join("");
    $$(".job-card", box).forEach((card) =>
      card.addEventListener("click", () => openJob(card.dataset.id)));
  }

  // ----- job detail + apply -----
  function openJob(id) {
    const j = jobs.find((x) => x.id === id);
    if (!j) return;
    openJobDetailModal(j, {
      mode: "apply",
      onApply: (isExternalJob(j) || j.status === "soon") ? undefined : () => {
        const user = getUser();
        if (!user) { openAuthModal("signup", () => openApply(j)); return; }
        if (user.role === "employer") { toast("Employer accounts can't apply — switch to a student account.", true); return; }
        openApply(j);
      },
    });
  }

  async function openApply(j) {
    if (j.status === "soon") {
      toast("This organization is not accepting applications yet.", true);
      return;
    }
    const user = getUser();
    const profile = (await store.getProfile(user.uid)) || {};
    const overlay = openModal(`
      <h3>Apply — ${esc(j.title)}</h3>
      <p class="sub">${esc(j.org)} · your profile details are attached automatically.</p>
      <form id="applyForm">
        <div class="field-row">
          <div class="field"><label>Full name</label>
            <input class="input" name="name" required value="${esc(profile.name || user.name || "")}"></div>
          <div class="field"><label>Email</label>
            <input class="input" name="email" type="email" required value="${esc(user.email)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Year</label>
            <select class="input" name="year">
              ${["Freshman","Sophomore","Junior","Senior","Recent grad"].map((y) =>
                `<option ${profile.year === y ? "selected" : ""}>${y}</option>`).join("")}
            </select></div>
          <div class="field"><label>Major</label>
            <input class="input" name="major" placeholder="Political Science" value="${esc(profile.major || "")}"></div>
        </div>
        <div class="field"><label>Résumé link (Google Drive, etc.)</label>
          <input class="input" name="resume" type="url" placeholder="https://…" value="${esc(profile.resume || "")}"></div>
        <div class="field"><label>Why are you a fit? (2–4 sentences)</label>
          <textarea class="input" name="note" required placeholder="I'm drawn to this role because…"></textarea></div>
        <div class="modal-foot">
          <button class="btn btn-primary btn-lg btn-block" type="submit">Submit application</button>
        </div>
      </form>`);

    $("#applyForm", overlay).addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await store.apply({
          jobId: j.id, jobTitle: j.title, org: j.org, jobOwnerId: j.ownerId || null,
          applicantId: user.uid, name: f.get("name").trim(), email: f.get("email").trim(),
          year: f.get("year"), major: f.get("major").trim(),
          resume: f.get("resume").trim(), note: f.get("note").trim(),
        });
        // remember the basics for next time
        await store.saveProfile(user.uid, {
          name: f.get("name").trim(), year: f.get("year"),
          major: f.get("major").trim(), resume: f.get("resume").trim(),
        });
        closeModal();
        toast("Application submitted — track it on your dashboard.");
      } catch (err) {
        toast(err.message || "Could not submit application.", true);
      }
    });
  }

  render();
  initReveal();

  // deep link: /jobs/?job=<id>
  const wanted = new URLSearchParams(location.search).get("job");
  if (wanted) openJob(wanted);
</script>
</body>
</html>
