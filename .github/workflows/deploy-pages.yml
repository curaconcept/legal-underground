name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "Missing FIREBASE_CONFIG repository secret"
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(process.env.FIREBASE_CONFIG);
          const body = `export const firebaseConfig = ${JSON.stringify(cfg, null, 2)};\n`;
          fs.writeFileSync("js/firebase-config.js", body);
          NODE

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
